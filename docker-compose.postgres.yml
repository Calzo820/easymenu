services:
  postgres:
    image: postgres:16-alpine
    container_name: ordynora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ordynora
      POSTGRES_PASSWORD: ordynora
      POSTGRES_DB: ordynora
    ports:
      - "5432:5432"
    volumes:
      - ordynora_postgres_data:/var/lib/postgresql/data

volumes:
  ordynora_postgres_data:
