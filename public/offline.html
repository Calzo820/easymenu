<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b2d2a" />
    <title>EasyMenu non disponibile</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f4f7f6;
        color: #10211f;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(460px, 100%);
        padding: 28px;
        border: 1px solid #d7e2df;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 18px 48px rgba(16, 33, 31, .12);
      }
      span { color: #0f766e; font-size: 12px; font-weight: 900; text-transform: uppercase; }
      h1 { margin: 10px 0; font-size: 30px; line-height: 1.05; }
      p { margin: 0 0 20px; color: #52635f; line-height: 1.55; }
      button {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 7px;
        background: #0b2d2a;
        color: #fff;
        font: inherit;
        font-weight: 900;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <span>EasyMenu Staff</span>
      <h1>Connessione assente</h1>
      <p>Ricollega il telefono a Internet e riprova. Gli ordini e i dati del ristorante non vengono mostrati senza una connessione sicura.</p>
      <button type="button" onclick="window.location.reload()">Riprova</button>
    </main>
  </body>
</html>
